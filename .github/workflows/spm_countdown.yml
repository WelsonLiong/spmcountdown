name: SPM 2026 Countdown Auto-Poster

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (validate calculations without posting)'
        required: false
        default: false
        type: boolean
      override_date:
        description: 'Simulate date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      refresh_token:
        description: 'Force refresh Threads access token'
        required: false
        default: false
        type: boolean

jobs:
  post-countdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SPM Countdown Post
        id: countdown
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          CMD="python post_countdown.py"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ "${{ inputs.refresh_token }}" = "true" ]; then
            CMD="$CMD --refresh-token"
          fi
          if [ -n "${{ inputs.override_date }}" ]; then
            CMD="$CMD --date ${{ inputs.override_date }}"
          fi
          $CMD

      - name: Persist Refreshed THREADS_ACCESS_TOKEN Secret
        if: steps.countdown.outputs.refreshed_threads_token != '' && secrets.GH_PAT != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.countdown.outputs.refreshed_threads_token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Persisting refreshed THREADS_ACCESS_TOKEN to GitHub repository secrets..."
          gh secret set THREADS_ACCESS_TOKEN --body "$NEW_TOKEN" --repo "$REPO"
          echo "Successfully updated THREADS_ACCESS_TOKEN secret for repository $REPO."
